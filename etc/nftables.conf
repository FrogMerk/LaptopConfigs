#!/usr/sbin/nft -f
# Minimal laptop firewall: allow outbound traffic, deny unsolicited inbound.
# Loopback, established/related flows, ICMP and DHCP clients are allowed.

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority 0; policy drop;

        iif "lo" accept

        ct state established,related accept
        ct state invalid drop

        ip protocol icmp accept
        ip6 nexthdr ipv6-icmp accept

        # DHCPv4 and DHCPv6 client replies.
        udp sport 67 udp dport 68 accept
        udp sport 547 udp dport 546 accept

        # Local service discovery, if Avahi is ever added.
        # udp dport 5353 accept
    }

    chain forward {
        type filter hook forward priority 0; policy drop;
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}
